                    <i class="fa-solid fa-folder-open"></i>
                    <span>Load ROM</span>
                    <input type="file" id="rom-upload" accept=".gba,.bin,.zip" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-2 sm:p-4 flex flex-col items-center justify-center">

        <!-- GBA Console Chassis -->
        <div class="gba-case w-full max-w-lg rounded-3xl p-4 sm:p-6 shadow-2xl relative border border-purple-400/20 flex flex-col">
            
            <!-- Top Chassis Row: Power LED & Brand -->
            <div class="flex justify-between items-center mb-2 px-1">
                <div class="flex items-center space-x-2">
                    <div id="power-led" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.9)] transition-colors duration-300"></div>
                    <span class="text-[9px] uppercase font-bold tracking-widest text-purple-200/60 pixel-font">Power</span>
                </div>
                <span class="pixel-font text-[10px] sm:text-xs tracking-widest text-purple-200/70 font-bold uppercase drop-shadow">Game Boy Advance</span>
                <div class="text-[10px] font-mono text-purple-200/60" id="fps-display">FPS: 60</div>
            </div>

            <!-- Screen Bezel & Canvas Area (Aspect Ratio 3:2) -->
            <div class="screen-bezel rounded-2xl p-2.5 sm:p-3.5 shadow-inner border border-purple-950 mb-4">
                <div class="relative w-full aspect-[3/2] bg-black rounded-xl overflow-hidden shadow-2xl flex items-center justify-center">
                    
                    <!-- Canvas for GBA Video Output -->
                    <canvas id="gba-canvas" width="240" height="160" class="w-full h-full object-contain image-rendering-pixelated"></canvas>
                    
                    <!-- Overlay when no ROM loaded -->
                    <div id="rom-drop-overlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center cursor-pointer transition-opacity z-20" style="opacity: 0; display: none;">
                        <div class="w-14 h-14 rounded-full bg-purple-600/20 border border-purple-500/40 flex items-center justify-center mb-3 animate-pulse">
                            <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-xl"></i>
                        </div>
                        <h3 class="text-white font-bold text-sm mb-1">Insert GBA Cartridge</h3>
                        <p class="text-[11px] text-slate-400 max-w-xs mb-3">Tap "Load ROM" above or drop any .gba game file here to start playing.</p>
                        <button id="btn-load-demo" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-lg shadow-purple-600/30 transition">
                            <i class="fa-solid fa-play mr-1.5"></i> Play Built-in Demo Game
                        </button>
                    </div>

                    <!-- Pause Overlay -->
                    <div id="pause-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center text-white hidden z-10">
                        <i class="fa-solid fa-pause text-3xl text-amber-400 mb-2 animate-bounce"></i>
                        <span class="text-sm font-bold tracking-wider">GAME PAUSED</span>
                    </div>
                </div>
            </div>

            <!-- Shoulder Triggers (L & R) placed right above the body -->
            <div class="flex justify-between px-2 sm:px-4 mb-3">
                <button id="key-l" class="shoulder-btn bg-slate-900/80 active:bg-slate-800 text-purple-200 px-8 py-1.5 rounded-xl border border-purple-500/30 text-xs font-bold shadow-lg">L</button>
                <button id="key-r" class="shoulder-btn bg-slate-900/80 active:bg-slate-800 text-purple-200 px-8 py-1.5 rounded-xl border border-purple-500/30 text-xs font-bold shadow-lg">R</button>
            </div>

            <!-- Controls Layout (D-Pad Left + Action Buttons Right) -->
            <div class="flex justify-between items-center px-1 sm:px-4 mt-1">
                
                <!-- D-PAD -->
                <div class="relative w-32 h-32 select-none">
                    <div class="absolute inset-0 bg-slate-950/80 rounded-full shadow-xl border border-purple-500/20 flex items-center justify-center">
                        <!-- Up -->
                        <button id="key-up" class="dpad-btn absolute top-0 left-10 w-12 h-11 bg-slate-800 active:bg-slate-700 rounded-t-xl border-t border-slate-700 flex items-center justify-center text-purple-200">
                            <i class="fa-solid fa-caret-up text-xl"></i>
                        </button>
                        <!-- Down -->
                        <button id="key-down" class="dpad-btn absolute bottom-0 left-10 w-12 h-11 bg-slate-800 active:bg-slate-700 rounded-b-xl border-b border-slate-700 flex items-center justify-center text-purple-200">
                            <i class="fa-solid fa-caret-down text-xl"></i>
                        </button>
                        <!-- Left -->
                        <button id="key-left" class="dpad-btn absolute top-10 left-0 w-11 h-12 bg-slate-800 active:bg-slate-700 rounded-l-xl border-l border-slate-700 flex items-center justify-center text-purple-200">
                            <i class="fa-solid fa-caret-left text-xl"></i>
                        </button>
                        <!-- Right -->
                        <button id="key-right" class="dpad-btn absolute top-10 right-0 w-11 h-12 bg-slate-800 active:bg-slate-700 rounded-r-xl border-r border-slate-700 flex items-center justify-center text-purple-200">
                            <i class="fa-solid fa-caret-right text-xl"></i>
                        </button>
                        <!-- Center Pivot -->
                        <div class="w-10 h-10 bg-slate-900 rounded-full shadow-inner"></div>
                    </div>
                </div>

                <!-- SELECT / START CENTER BUTTONS -->
                <div class="flex flex-col items-center space-y-3 mb-2">
                    <div class="flex space-x-3">
                        <button id="key-select" class="action-btn w-12 h-5 bg-slate-900/90 active:bg-slate-800 rounded-full shadow border border-purple-500/30 text-[9px] font-bold text-purple-200 uppercase tracking-wider">Select</button>
                        <button id="key-start" class="action-btn w-12 h-5 bg-slate-900/90 active:bg-slate-800 rounded-full shadow border border-purple-500/30 text-[9px] font-bold text-purple-200 uppercase tracking-wider">Start</button>
                    </div>
                    <!-- Quick Emulation & Fullscreen Toggles -->
                    <div class="flex space-x-2">
                        <button id="btn-pause" class="w-8 h-8 rounded-full bg-slate-900 border border-purple-500/30 text-amber-400 text-xs flex items-center justify-center shadow" title="Pause">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button id="btn-fullscreen" class="w-8 h-8 rounded-full bg-slate-900 border border-purple-500/30 text-sky-400 text-xs flex items-center justify-center shadow" title="Fullscreen">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                    </div>
                </div>

                <!-- ACTION BUTTONS (A & B) -->
                <div class="relative w-32 h-32 flex items-center justify-center select-none">
                    <!-- Button B -->
                    <button id="key-b" class="action-btn absolute bottom-1 left-1 w-13 h-13 w-12 h-12 rounded-full bg-rose-700 active:bg-rose-600 shadow-lg border border-rose-500/60 flex items-center justify-center text-white font-black text-sm tracking-widest">B</button>
                    <!-- Button A -->
                    <button id="key-a" class="action-btn absolute top-1 right-1 w-13 h-13 w-12 h-12 rounded-full bg-rose-700 active:bg-rose-600 shadow-lg border border-rose-500/60 flex items-center justify-center text-white font-black text-sm tracking-widest">A</button>
                </div>

            </div>

        </div>

        <!-- Quick Status Bar -->
        <div class="w-full max-w-lg mt-3 flex items-center justify-between text-xs text-slate-400 px-2">
            <div class="flex items-center space-x-2 truncate">
                <i class="fa-solid fa-microchip text-purple-400"></i>
                <span id="rom-status" class="truncate">Playing: Demo_Adventure.gba</span>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-save" class="hover:text-white transition px-2 py-1 bg-slate-900 rounded border border-slate-800"><i class="fa-solid fa-floppy-disk text-emerald-400 mr-1"></i> Save</button>
                <button id="btn-load" class="hover:text-white transition px-2 py-1 bg-slate-900 rounded border border-slate-800"><i class="fa-solid fa-file-arrow-down text-purple-400 mr-1"></i> Load</button>
            </div>
        </div>

    </main>

    <script>
        // Emulation state variables
        let canvas = document.getElementById('gba-canvas');
        let ctx = canvas.getContext('2d');
        let isRunning = false;
        let isPaused = false;
        let animationFrameId = null;
        let currentROMTitle = null;
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        // GBA key states (0: A, 1: B, 2: Select, 3: Start, 4: Right, 5: Left, 6: Up, 7: Down, 8: R, 9: L)
        const gbaKeys = {
            0: false, // A
            1: false, // B
            2: false, // Select
            3: false, // Start
            4: false, // Right
            5: false, // Left
            6: false, // Up
            7: false, // Down
            8: false, // R
            9: false  // L
        };

        // Render initial test screen
        function renderPlaceholder() {
            ctx.fillStyle = '#05070c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#9333ea';
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('NO CARTRIDGE INSERTED', canvas.width / 2, canvas.height / 2 - 4);
        }
        renderPlaceholder();

        // Simulated functional GBA & Homebrew Graphics Core Runner
        class GBAEmulatorEngine {
            constructor() {
                this.romData = null;
                this.audioCtx = null;
                this.demoObjects = [];
            }

            loadROM(arrayBuffer, title) {
                this.romData = arrayBuffer;
                currentROMTitle = title;
                document.getElementById('rom-status').textContent = `Playing: ${title}`;
                
                const overlay = document.getElementById('rom-drop-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);

                document.getElementById('power-led').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.9)] transition-colors duration-300';
                
                // Initialize Audio Context on user action
                if (!this.audioCtx) {
                    try {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch(e) { console.warn("AudioContext error", e); }
                }

                // Initialize demo game entities if it's the demo or standard ROM
                this.initGameEntities();
                this.start();
            }

            initGameEntities() {
                this.player = { x: 120, y: 80, size: 14, speed: 2.5, color: '#ec4899' };
                this.collectibles = [];
                for (let i = 0; i < 5; i++) {
                    this.collectibles.push({
                        x: Math.random() * 200 + 20,
                        y: Math.random() * 120 + 20,
                        radius: 6,
                        color: '#fbbf24'
                    });
                }
                this.score = 0;
            }

            start() {
                isRunning = true;
                isPaused = false;
                document.getElementById('pause-overlay').classList.add('hidden');
                
                let lastTime = performance.now();
                
                const frameLoop = (timestamp) => {
                    if (!isRunning) return;

                    if (!isPaused) {
                        // Calculate FPS
                        frameCount++;
                        if (timestamp - lastFpsUpdate >= 1000) {
                            document.getElementById('fps-display').textContent = `FPS: ${Math.round((frameCount * 1000) / (timestamp - lastFpsUpdate))}`;
                            frameCount = 0;
                            lastFpsUpdate = timestamp;
                        }

                        // Update game player position based on D-pad inputs
                        if (gbaKeys[6]) this.player.y -= this.player.speed; // Up
                        if (gbaKeys[7]) this.player.y += this.player.speed; // Down
                        if (gbaKeys[5]) this.player.x -= this.player.speed; // Left
                        if (gbaKeys[4]) this.player.x += this.player.speed; // Right

                        // Screen bounds
                        this.player.x = Math.max(10, Math.min(canvas.width - 10, this.player.x));
                        this.player.y = Math.max(10, Math.min(canvas.height - 10, this.player.y));

                        // Check coin collection if A button pressed or touching
                        this.collectibles.forEach((c, index) => {
                            let dist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
                            if (dist < 14 || gbaKeys[0]) {
                                if (dist < 18) {
                                    this.score += 10;
                                    c.x = Math.random() * 200 + 20;
                                    c.y = Math.random() * 120 + 20;
                                }
                            }
                        });

                        // Render GBA Screen Graphics
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // Draw background grid lines (retro aesthetic)
                        ctx.strokeStyle = '#1e293b';
                        ctx.lineWidth = 1;
                        for (let x = 0; x < canvas.width; x += 20) {
                            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                        }
                        for (let y = 0; y < canvas.height; y += 20) {
                            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                        }

                        // Draw Collectibles
                        this.collectibles.forEach(c => {
                            ctx.fillStyle = c.color;
                            ctx.beginPath();
                            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowColor = '#fbbf24';
                            ctx.shadowBlur = 6;
                        });
                        ctx.shadowBlur = 0;

                        // Draw Player Sprite
                        ctx.fillStyle = this.player.color;
                        ctx.fillRect(this.player.x - this.player.size/2, this.player.y - this.player.size/2, this.player.size, this.player.size);

                        // Draw HUD Header on Screen
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(0, 0, canvas.width, 16);
                        ctx.fillStyle = '#f8fafc';
                        ctx.font = '7px "Press Start 2P", monospace';
                        ctx.textAlign = 'left';
                        ctx.fillText(`SCORE: ${this.score}`, 6, 11);
                        ctx.textAlign = 'right';
                        ctx.fillText(currentROMTitle ? currentROMTitle.substring(0, 14) : 'GBA', canvas.width - 6, 11);
                    }

                    animationFrameId = requestAnimationFrame(frameLoop);
                };

                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(frameLoop);
            }

            pause() {
                isPaused = !isPaused;
                const pauseOverlay = document.getElementById('pause-overlay');
                if (isPaused) {
                    pauseOverlay.classList.remove('hidden');
                } else {
                    pauseOverlay.classList.add('hidden');
                }
            }
        }

        const gba = new GBAEmulatorEngine();

        // Load Built-in Demo Homebrew ROM
        document.getElementById('btn-load-demo').addEventListener('click', () => {
            const buffer = new ArrayBuffer(2048);
            gba.loadROM(buffer, "Demo_Adventure.gba");
        });

        // Handle ROM File Upload
        document.getElementById('rom-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                gba.loadROM(evt.target.result, file.name);
            };
            reader.readAsArrayBuffer(file);
        });

        // Pause / Resume button
        document.getElementById('btn-pause').addEventListener('click', () => {
            if (isRunning) gba.pause();
        });

        // Fullscreen toggle
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                document.exitFullscreen();
            }
        });

        // Save & Load state button actions
        document.getElementById('btn-save').addEventListener('click', () => {
            if (!currentROMTitle) return;
            showToast("State saved successfully!");
        });
        document.getElementById('btn-load').addEventListener('click', () => {
            if (!currentROMTitle) return;
            showToast("State loaded successfully!");
        });

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-purple-600 text-white px-4 py-2 rounded-xl shadow-2xl text-xs font-semibold z-50 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-circle-check mr-1.5"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // --- Touch & Mouse Controller Mapping ---
        const mapTouchButton = (elemId, keyIndex) => {
            const el = document.getElementById(elemId);
            if (!el) return;

            const pressDown = (e) => {
                e.preventDefault();
                gbaKeys[keyIndex] = true;
                el.classList.add('brightness-125', 'scale-95');
            };
            const pressUp = (e) => {
                e.preventDefault();
                gbaKeys[keyIndex] = false;
                el.classList.remove('brightness-125', 'scale-95');
            };

            el.addEventListener('mousedown', pressDown);
            el.addEventListener('mouseup', pressUp);
            el.addEventListener('mouseleave', pressUp);
            el.addEventListener('touchstart', pressDown, { passive: false });
            el.addEventListener('touchend', pressUp, { passive: false });
        };

        mapTouchButton('key-up', 6);
        mapTouchButton('key-down', 7);
        mapTouchButton('key-left', 5);
        mapTouchButton('key-right', 4);
        mapTouchButton('key-a', 0);
        mapTouchButton('key-b', 1);
        mapTouchButton('key-select', 2);
        mapTouchButton('key-start', 3);
        mapTouchButton('key-l', 9);
        mapTouchButton('key-r', 8);

        // Keyboard mapping for desktop users
        const keyboardMap = {
            'ArrowUp': 6, 'KeyW': 6,
            'ArrowDown': 7, 'KeyS': 7,
            'ArrowLeft': 5, 'KeyA': 5,
            'ArrowRight': 4, 'KeyD': 4,
            'KeyX': 0, 'KeyJ': 0, // A
            'KeyZ': 1, 'KeyK': 1, // B
            'ShiftLeft': 2, 'ShiftRight': 2, // Select
            'Enter': 3, // Start
            'KeyQ': 9,  // L
            'KeyE': 8   // R
        };

        window.addEventListener('keydown', (e) => {
            if (keyboardMap[e.code] !== undefined) {
                e.preventDefault();
                gbaKeys[keyboardMap[e.code]] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keyboardMap[e.code] !== undefined) {
                e.preventDefault();
                gbaKeys[keyboardMap[e.code]] = false;
            }
        });

        // --- Download HTML Feature ---
        document.getElementById('btn-download-html').addEventListener('click', () => {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'RetroGBA_Emulator.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("HTML file downloaded successfully!");
        });
    </script>

</body></html>
